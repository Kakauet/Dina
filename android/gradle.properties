org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
# Faster local builds: reuse outputs, configure once, build modules in parallel.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=false
# true = debug APK also bundles the ~900 MB of models (slow); see scripts/dev.ps1.
dina.bundleModels=false
